name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (libs + artifacts)
        run: pnpm run typecheck

      - name: Unit tests (api-server, no DB — integration tests self-skip)
        run: |
          set -o pipefail
          pnpm --filter @workspace/api-server run test 2>&1 | tee /tmp/test.log

      - name: Failing tests → annotations
        if: failure()
        run: |
          # спершу деталі (текст помилок), потім назви — у GitHub видно ~10 аннотацій на крок
          grep -A14 -E '^(✖ failing tests|# Subtest.*failed)' /tmp/test.log | grep -E 'Error|error|!==|ENOENT|at .*src/' | sort -u | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          grep -E '^(✖|not ok) ' /tmp/test.log | sort -u | head -15 | while IFS= read -r l; do echo "::error::$l"; done
          echo "----- failure details -----"
          grep -A14 -E '^(✖ failing tests|# Subtest.*failed)' /tmp/test.log | head -200 || true

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grafik_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/grafik_bot_test
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Chrome for PDF tests (postinstall puppeteer у CI Chrome не докачує)
        run: |
          set -o pipefail
          if ! pnpm --filter @workspace/api-server exec puppeteer browsers install chrome 2>&1 | tee /tmp/chrome.log; then
            grep -vE '^\s*$' /tmp/chrome.log | tail -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Load schema + migrations into the test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d grafik_bot_test -v ON_ERROR_STOP=1 -f deploy/schema.sql
          for m in deploy/migrations/*.sql; do
            echo "-- applying $m"
            psql -h localhost -U postgres -d grafik_bot_test -f "$m"
          done

      - name: Integration tests (api-server + Postgres)
        run: |
          set -o pipefail
          pnpm --filter @workspace/api-server run test 2>&1 | tee /tmp/test.log

      - name: Failing tests → annotations
        if: failure()
        run: |
          # спершу деталі (текст помилок), потім назви — у GitHub видно ~10 аннотацій на крок
          grep -A14 -E '^(✖ failing tests|# Subtest.*failed)' /tmp/test.log | grep -E 'Error|error|!==|ENOENT|at .*src/' | sort -u | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          grep -E '^(✖|not ok) ' /tmp/test.log | sort -u | head -15 | while IFS= read -r l; do echo "::error::$l"; done
          echo "----- failure details -----"
          grep -A14 -E '^(✖ failing tests|# Subtest.*failed)' /tmp/test.log | head -200 || true
