name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (libs + artifacts)
        run: pnpm run typecheck

      - name: Unit tests (api-server, no DB — integration tests self-skip)
        run: |
          set -o pipefail
          pnpm --filter @workspace/api-server run test 2>&1 | tee /tmp/test.log

      - name: Failing tests → annotations
        if: failure()
        run: |
          # GitHub показує ~10 аннотацій на крок: «тест :: перша помилка», без дублів
          awk '/^✖ failing tests/{on=1;next} on && /^✖ /{name=$0;next} on && name && /Error|error|!==|ENOENT/{sub(/^[ \t]+/,"");print name " :: " $0;name=""}' /tmp/test.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          echo "----- failure details -----"
          grep -A14 -E '^(✖ failing tests|# Subtest.*failed)' /tmp/test.log | head -200 || true

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grafik_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/grafik_bot_test
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Chrome for PDF tests (postinstall puppeteer у CI Chrome не докачує)
        run: |
          set -o pipefail
          rm -rf ~/.cache/puppeteer/chrome
          if ! pnpm --filter @workspace/api-server exec puppeteer browsers install chrome --format '{{path}}' 2>&1 | tee /tmp/chrome.log; then
            grep -vE '^\s*$' /tmp/chrome.log | tail -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          CHROME=$(grep -E '^/.*/chrome$' /tmp/chrome.log | tail -1)
          echo "::notice::chrome=$CHROME"; ls -la "$CHROME"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Chrome smoke launch
        working-directory: artifacts/api-server
        run: |
          set -o pipefail
          if ! node -e "require('puppeteer').launch({headless:true,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']}).then(async b=>{console.log('chrome ok',await b.version());await b.close()})" 2>&1 | tee /tmp/smoke.log; then
            grep -vE '^\s*$' /tmp/smoke.log | head -12 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Load schema + migrations into the test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d grafik_bot_test -v ON_ERROR_STOP=1 -f deploy/schema.sql
          for m in deploy/migrations/*.sql; do
            echo "-- applying $m"
            psql -h localhost -U postgres -d grafik_bot_test -f "$m"
          done

      - name: Integration tests (api-server + Postgres)
        run: |
          set -o pipefail
          pnpm --filter @workspace/api-server run test 2>&1 | tee /tmp/test.log

      - name: Failing tests → annotations
        if: failure()
        run: |
          # GitHub показує ~10 аннотацій на крок: «тест :: перша помилка», без дублів
          awk '/^✖ failing tests/{on=1;next} on && /^✖ /{name=$0;next} on && name && /Error|error|!==|ENOENT/{sub(/^[ \t]+/,"");print name " :: " $0;name=""}' /tmp/test.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          echo "----- failure details -----"
          grep -A14 -E '^(✖ failing tests|# Subtest.*failed)' /tmp/test.log | head -200 || true
